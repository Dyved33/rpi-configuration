# Named 10-* so it is read BEFORE other files (sshd: first value wins).
# Note: Modern OpenSSH exclusively uses Protocol 2 (Protocol 1 was removed in OpenSSH 7.6).
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
# Optional: only allow specific users
# AllowUsers youruser
